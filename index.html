<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btn-translate" class="bp-translate-btn">
        <span class="icon">A/あ</span>
        <span class="text">Traducir página</span>
    </button>

    <canvas id="particle-canvas"></canvas>

    <div id="final-message-container" class="hidden">
        <h1 class="final-text">Te amo con todo mi corazón,<br><span>Yuliana</span></h1>
    </div>

    <div class="book-container">
        <div class="book" id="book">
            
            <div class="page active" data-song="assets/music/moonlit_floor.mp3">
                <div class="front" style="background-image: url('assets/images/inicio.png');">
                    <div class="tap-hint">Tap to continue →</div>
                </div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/money.mp3">
                <div class="front" style="background-image: url('assets/images/teamo(1).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/stay.mp3">
                <div class="front" style="background-image: url('assets/images/carta(2).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/Lalisa.mp3">
                <div class="front" style="background-image: url('assets/images/lisa(3).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/seoul_city.mp3">
                <div class="front" style="background-image: url('assets/images/jennie(4).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/your_love.mp3">
                <div class="front" style="background-image: url('assets/images/jisoo(5).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/number_one_girl.mp3">
                <div class="front" style="background-image: url('assets/images/rose(6).png');"></div>
                <div class="back"></div>
            </div>

            <div class="page" data-song="assets/music/your_last.mp3">
                <div class="front" style="background-image: url('assets/images/final(7).png');"></div>
                <div class="back"></div>
            </div>

        </div>
    </div>

    <audio id="bg-music" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
